name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Set up
        run: mise run setup
      # Restore after setup, because `npm ci` deletes `node_modules`.
      # The cache is keyed by digests of image sources and settings, so a partial match still saves work.
      - name: Restore WebP copies of images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/article-images
          key: article-images-${{ hashFiles('assets/images/**', 'src/lib/assets.ts', 'package-lock.json') }}
          restore-keys: article-images-
      - name: Check formatting, lint, and types
        run: mise run check
      - name: Run unit tests
        run: mise run test:unit
      - name: Build
        run: mise run build
      - name: Check the built site
        run: node scripts/check-site.ts
      - name: Compare with the Jekyll reference
        run: node scripts/compare-reference.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx vp test --project browser --project site
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
