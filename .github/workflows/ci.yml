name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Set up
        run: mise run setup
      - name: Check formatting, lint, and types
        run: mise run check
      - name: Run unit tests
        run: mise run test:unit
      - name: Build
        run: mise run build
      - name: Check the built site
        run: node scripts/check-site.ts
      - name: Compare with the Jekyll reference
        run: node scripts/compare-reference.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx vp test --project browser --project site
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
