[tools]
node = "24"

[env]
# Let the terminal or Conductor manage the development server process.
ASTRO_DEV_BACKGROUND = "0"
# Keep Astro's anonymous usage data off in local runs and CI.
ASTRO_TELEMETRY_DISABLED = "1"

[tasks.setup]
description = "Install tools and locked dependencies"
run = ["mise install", "npm ci --no-audit --no-fund"]

[tasks."setup:browsers"]
description = "Install the Chromium build used by browser tests and screenshots"
run = "npx playwright install chromium"

[tasks.dev]
description = "Start the development server (uses CONDUCTOR_PORT, or 4321)"
run = 'npx astro dev --host 127.0.0.1 --port "${CONDUCTOR_PORT:-4321}"'

[tasks.build]
description = "Build the static site into dist/ with the latest articles"
run = "npx astro build"

[tasks."build:pinned"]
description = "Build the static site into dist/ with the articles that the tests and Jekyll reference match"
# NSHipster/articles keeps changing, so tests use the articles at this commit.
env = { ARTICLES_REF = "1d68ce915ae1213ea2d83370c934482f5ad86b54" }
run = "npx astro build"

[tasks.check]
description = "Check formatting, lint, and types with Vite+ and Astro"
run = ["npx astro sync", "npx vp check", "npx astro check"]

[tasks."check:site"]
description = "Check the built site for broken links, duplicate IDs, and feed problems"
depends = ["build"]
run = "node scripts/check-site.ts"

[tasks."test:unit"]
description = "Run unit and rendering fixture tests"
run = "npx vp test --project unit"

[tasks."test:browser"]
description = "Run browser tests for scripts and the built site"
depends = ["build:pinned", "setup:browsers"]
run = "npx vp test --project browser --project site"

[tasks."reference:compare"]
description = "Compare dist/ with the Jekyll reference facts (and pages, given a reference build directory)"
depends = ["build:pinned"]
run = "node scripts/compare-reference.ts"

[tasks."audit:weight"]
description = "Report the heaviest pages and largest images in dist/"
depends = ["build"]
run = "node scripts/audit-page-weight.ts"

[tasks."icons:generate"]
description = "Generate browser, home screen, and installed app icons from the SVG logo"
run = "node scripts/generate-icons.ts"

[tasks.preview]
description = "Serve dist/ with Cloudflare's local runtime (uses CONDUCTOR_PORT, or 8788)"
depends = ["build"]
run = 'npx wrangler dev --ip 127.0.0.1 --port "${CONDUCTOR_PORT:-8788}"'

[tasks.deploy]
description = "Build and deploy to production on Cloudflare"
depends = ["build"]
run = "npx wrangler deploy"

[tasks."deploy:preview"]
description = "Build and create a Preview of the current branch on Cloudflare"
depends = ["build"]
run = "npx wrangler preview"
